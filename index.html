<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>창녕여자고등학교 바로 가기</title>

  <style>
    @font-face {
      font-family: 'HsBombaram30';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-10@1.1/HSBombaram3_Thin.woff') format('woff');
      font-weight: 100;
      font-display: swap;
    }

    @font-face {
      font-family: 'HsBombaram30';
      src: url('https://gcore.jsdelivr.net/gh/projectnoonnu/noonfonts_20-10@1.1/HSBombaram3_Regular.woff') format('woff');
      font-weight: normal;
      font-display: swap;
    }

    ody {
  font-family: "Noto Sans KR", sans-serif;
  background: linear-gradient(
    to bottom,
    #ffffff 0%,
    #f8fcff 35%,
    #e8f6ff 70%,
    #d5efff 100%
  );
  text-align: center;
  padding: 60px;
  margin: 0;
  min-height: 100vh;
  box-sizing: border-box;
  position: relative;
  overflow: hidden;
}

body::before {
  content: "";
  position: fixed;
  width: 450px;
  height: 450px;
  border-radius: 50%;
  background: rgba(180, 225, 255, 0.25);
  top: -180px;
  left: -120px;
  filter: blur(30px);
  z-index: -1;
}

body::after {
  content: "";
  position: fixed;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  background: rgba(150, 215, 255, 0.2);
  bottom: -220px;
  right: -150px;
  filter: blur(40px);
  z-index: -1;
}

    h1 {
      color: #333;
      font-size: 4.2rem;
      margin-bottom: 100px;
      font-family: 'HsBombaram30', sans-serif;
      word-break: keep-all;
    }

    .button-container {
      display: flex;
      justify-content: center;
      gap: 50px;
      flex-wrap: wrap;
    }

    a img {
      width: 440px;
      height: auto;
      border-radius: 15px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    a img:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    @media (max-width: 768px) {
      body {
        padding: 30px;
      }

      h1 {
        font-size: 3rem;
        margin-bottom: 60px;
      }

      .button-container {
        gap: 25px;
      }

      a img {
        width: 80%;
        max-width: 350px;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.8rem;
        margin-bottom: 40px;
      }

      a img {
        width: 90%;
        max-width: 300px;
      }
    }
  </style>
</head>

<body>
  <h1>창녕여자고등학교 <div></div> 바로 가기</h1>

  <div class="button-container">
    <!-- 🏫 학교 홈페이지 버튼 -->
    <a href="https://changnyeongyeo-h.gne.go.kr/changnyeongyeo-h/cm/cntnts/cntntsView.do?mi=583850&cntntsId=25384" target="_blank">
      <img src="/-/school_button.PNG" alt="홈페이지 버튼">
    </a>

    <!-- 📄 보통과 PDF 보기 버튼 -->
    <a href="/-/pdf.html" target="_blank">
      <img src="/-/pdf_button.PNG" alt="보통과 안내문 버튼">
    </a>

    <!-- ➕ 간호과 PDF 보기 버튼 -->
    <a href="/-/pdf2.html" target="_blank">
      <img src="/-/new_button.PNG" alt="간호과 안내문 버튼">
    </a>
  </div>
</body>
</html>
